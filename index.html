function setLang(l){lang=l;localStorage.setItem('cl',l);document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.lang-btn').forEach(b=>{if((l==='zh'&&b.textContent.includes('中文'))||(l==='lo'&&b.textContent.includes('ລາວ'))||(l==='en'&&b.textContent.includes('English')))b.classList.add('active')});const m={title:'title',subtitle:'subtitle',h_create:'h_create',h_wait:'h_wait',h_join:'h_join',l_name:'l_name',l_name2:'l_name2',l_share:'l_share',l_online:'l_online',l_ppl:'l_ppl',l_rid:'l_rid',l_round:'l_round',l_curr:'l_curr',l_play:'l_play',l_wait:'l_wait',l_hand:'l_hand',l_tip:'l_tip',l_pass:'l_pass',l_ready:'l_ready'};Object.keys(m).forEach(k=>{const el=document.getElementById(m[k]);if(el)el.textContent=L[l][k]||el.textContent});document.getElementById('cs2').textContent=L[l].conn;document.getElementById('btn_create').textContent=L[l].start;document.getElementById('btn_copy').textContent=L[l].copy;document.getElementById('btn_start').textContent=L[l].start;document.getElementById('btn_join').textContent=L[l].join;document.getElementById('btn_play').textContent=L[l].btnPlay;document.getElementById('btn_pass').textContent=L[l].btnPass;document.getElementById('btn_next').textContent=L[l].btnNext;document.getElementById('btn_exit').textContent=L[l].btnExit;document.getElementById('btn_ready').textContent=L[l].ready2;document.getElementById('btn_again').textContent=L[l].again}

function rs(){document.getElementById('sa').innerHTML=players.map((p,i)=>'<div class="st '+(p.eliminated?'eliminated':i===cci?'a':'')+(p.id===myId?' m':'')+'"><div class="n">'+p.name+(p.id===rh?t('host'):'')+'</div><div style="display:flex;justify-content:center;margin-top:5px">'+Array(p.hc||0).fill('<div class="cd bk mini"></div>').join('')+'</div><div style="color:#888;font-size:10px;margin-top:3px">'+t('tung')+': '+p.tungs+(p.eliminated?' '+t('elim'):'')+'</div></div>').join('')}
function rc(){const c=document.getElementById('cc'),b=document.getElementById('cb');if(!lp){c.innerHTML='<span style="color:#444;font-size:12px">'+t('wait')+'</span>';b.textContent='';return}c.innerHTML='<div class="cd '+(lp.suit==='heart'||lp.suit==='diamond'?'r':'k')+'" style="cursor:default"><div class="cn t"><span class="cr">'+lp.rank+'</span><span class="cs">'+SS[lp.suit]+'</span></div><div class="cc">'+SS[lp.suit]+'</div><div class="cn b"><span class="cr">'+lp.rank+'</span><span class="cs">'+SS[lp.suit]+'</span></div></div>';b.textContent=(players[lpi]?.name||'')}
function rh3(){const me=players.find(p=>p.id===myId);if(!me||!me.h)return;document.getElementById('mc').textContent='('+me.h.length+')';document.getElementById('mh').innerHTML=me.h.map((c,i)=>{if(!c)return'';return'<div class="cd '+(c.suit==='heart'||c.suit==='diamond'?'r':'k')+' '+(sc===i?'sel':'')+'" onclick="sc2('+i+')"><div class="cn t"><span class="cr">'+c.rank+'</span><span class="cs">'+SS[c.suit]+'</span></div><div class="cc">'+SS[c.suit]+'</div><div class="cn b"><span class="cr">'+c.rank+'</span><span class="cs">'+SS[c.suit]+'</span></div></div>'}).join('')}
function sc2(i){if(cci!==mi)return;sc=sc===i?-1:i;rh3()}
function ub(){const mt=cci===mi;document.getElementById('bp').style.display=mt?'inline-block':'none';document.getElementById('bps').style.display=mt&&rh2.length>0?'inline-block':'none'}
function pc(){if(sc<0)return tt(t('selCard'));pa(myId,'play',{ci:sc});sc=-1}
function ps(){pa(myId,'pass',{})}
function sr(wi){document.getElementById('rt').textContent=t('winner')+' '+(players[wi]?.name||'');document.getElementById('ri2').textContent=t('tung')+': '+(players[0]?.tungs||0)+' vs '+(players[1]?.tungs||0);document.getElementById('rsp').classList.add('show')}
function ho(){document.getElementById('ov').classList.remove('show')}
function cp2(){navigator.clipboard?.writeText(document.getElementById('rid').textContent);tt(t('copied'))}
function tt(m){const e=document.getElementById('ts');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function sc2(h){return h.sort((a,b)=>a.suit!==b.suit?a.suitOrder-b.suitOrder:a.value-b.value)}
document.getElementById('mn').value='Player'+Math.floor(Math.random()*100);
document.getElementById('jn').value=document.getElementById('mn').value;
ip();setLang(lang);
</script>
